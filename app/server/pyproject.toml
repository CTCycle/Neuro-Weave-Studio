[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "neuro-weave-backend"
version = "1.0.0"
description = "FastAPI backend for a visual machine-learning architecture editor"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.52.3,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.15,<3",
  "SQLAlchemy>=2.0.52,<3",
  "alembic>=1.19,<2",
  "filelock>=3.20,<4",
  "keras>=3.10,<4",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.20,<3"]
torch-cpu = ["torch>=2.1,<3"]
torch-cu126 = ["torch>=2.1,<3"]
jax = ["jax>=0.6,<1", "flax>=0.10,<1"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.16.3,<1",
  "pyright>=1.1.403,<2",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "app.py",
  "api",
  "common",
  "compilation",
  "configurations",
  "domain",
  "alembic.ini",
  "migrations",
  "exporters",
  "repositories",
  "resources",
  "services",
  "validation",
  "models",
]

[tool.uv]
cache-dir = "../../runtimes/cache/uv"
conflicts = [
  [
    { extra = "torch-cpu" },
    { extra = "torch-cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", extra = "torch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"
cache-dir = "../tests/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.pyright]
include = [".", "../scripts", "../tests"]
exclude = [".venv", "__pycache__", ".pytest_cache", ".ruff_cache"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
