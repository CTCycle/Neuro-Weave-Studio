[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "neuro-weave-backend"
version = "0.1.0"
description = "FastAPI backend for a visual machine-learning architecture editor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "keras>=3.10,<4",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.20,<3"]
torch = ["torch>=2.1,<3"]
torch-cpu = ["torch>=2.1,<3"]
torch-cu126 = ["torch>=2.1,<3"]
jax = ["jax>=0.6,<1", "flax>=0.10,<1"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "pyright>=1.1.403,<2",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "app.py",
  "api",
  "common",
  "compilation",
  "configurations",
  "domain",
  "exporters",
  "repositories",
  "resources",
  "services",
  "validation",
  "models",
]

[tool.uv]
conflicts = [
  [
    { extra = "torch" },
    { extra = "torch-cpu" },
    { extra = "torch-cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", extra = "torch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.pyright]
include = [".", "../scripts", "../tests"]
exclude = [".venv", "__pycache__", ".pytest_cache", ".ruff_cache"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
