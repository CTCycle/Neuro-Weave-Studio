[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "neuro-weave-backend"
version = "0.1.0"
description = "FastAPI backend for a visual machine-learning architecture editor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
keras = ["keras>=3.10,<4", "tensorflow>=2.20,<3"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["neuro_weave"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
addopts = "-q --basetemp=../../assets/QA/pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]
