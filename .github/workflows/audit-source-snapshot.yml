name: Apply stabilization patch

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/apply_stabilization.py
      - .github/workflows/audit-source-snapshot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Apply verified stabilization patch
        run: python .github/apply_stabilization.py
      - name: Refresh backend lockfile
        run: uv lock --project app/server
      - name: Verify Python syntax and patch integrity
        run: |
          python -m compileall -q app/server app/tests
          git diff --check
      - name: Commit stabilization changes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm .github/apply_stabilization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml app/server app/tests
          git commit -m "fix: complete application stabilization pass"
          git push origin HEAD:"$HEAD_BRANCH"
