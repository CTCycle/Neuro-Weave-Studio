name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: app

jobs:
  backend:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock
      - name: Install locked QA dependencies
        run: >-
          uv sync --locked --project app/server
          --extra test
          --extra torch-cpu
          --extra export
      - name: Compile backend
        run: uv run --project app/server python -m compileall app/server
      - name: Ruff
        working-directory: app/server
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          uv run ruff check . ../tests 2>&1 | tee ../../.ci-logs/ruff.log
      - name: Pyright
        working-directory: app/server
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          uv run pyright 2>&1 | tee ../../.ci-logs/pyright.log
      - name: Backend tests
        if: ${{ always() && !cancelled() }}
        env:
          NEURO_WEAVE_ML_JOB_ROOT: ${{ runner.temp }}/neuro-weave-ml
          PYTEST_ADDOPTS: "--basetemp=${{ runner.temp }}/neuro-weave-pytest"
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          uv run --project app/server python -m pytest app/tests -q 2>&1 | tee .ci-logs/pytest.log
      - name: Upload backend diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: neuro-backend-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            app/tests/cache/
            .ci-logs/

  frontend:
    name: Angular quality, tests, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - name: Install locked dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: app/client
        run: npm run lint
      - name: Unit tests
        working-directory: app/client
        run: npm test
      - name: Production build
        working-directory: app/client
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          npm run build 2>&1 | tee ../../.ci-logs/frontend-build.log
      - name: Set up Python for browser tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up UV for browser tests
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install backend runtime for browser tests
        run: uv sync --locked --project app/server --extra torch-cpu
      - name: Start backend for browser tests
        env:
          DATABASE_SQLITE_PATH: ${{ runner.temp }}/neuro-weave-e2e.db
          NEURO_WEAVE_EXPORT_ROOT: ${{ runner.temp }}/neuro-weave-e2e-exports
          NEURO_WEAVE_ML_JOB_ROOT: ${{ runner.temp }}/neuro-weave-e2e-jobs
          NEURO_WEAVE_RUNTIME_DISCOVERY_PATH: ${{ runner.temp }}/neuro-weave-e2e-discovery.json
        run: |
          mkdir -p "${{ runner.temp }}/neuro-weave-e2e-logs"
          nohup uv run --project app/server uvicorn app:create_app --factory --host 127.0.0.1 --port 8000 > "${{ runner.temp }}/neuro-weave-e2e-logs/backend.log" 2>&1 &
          echo $! > "${{ runner.temp }}/neuro-weave-e2e-logs/backend.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${{ runner.temp }}/neuro-weave-e2e-logs/backend.log"
          exit 1
      - name: Prime runtime capability discovery
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/api/execution/discovery \
            -H 'content-type: application/json' \
            -d '{"backend":"pytorch","api":"keras"}'
          for attempt in {1..90}; do
            response="$(curl --fail --silent --show-error \
              'http://127.0.0.1:8000/api/execution/discovery?backend=pytorch&api=keras')"
            state="$(printf '%s' "$response" | jq -r '.state')"
            if [ "$state" = "verified" ]; then
              exit 0
            fi
            if [ "$state" = "unavailable" ] || [ "$state" = "failed" ]; then
              printf '%s\n' "$response"
              exit 1
            fi
            sleep 1
          done
          printf '%s\n' "$response"
          exit 1
      - name: Install Playwright browser
        working-directory: app/client
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: app/client
        env:
          FASTAPI_HOST: 127.0.0.1
          FASTAPI_PORT: 8000
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          npm run e2e 2>&1 | tee ../../.ci-logs/playwright.log
      - name: Stop backend for browser tests
        if: ${{ always() }}
        run: |
          pid_file="${{ runner.temp }}/neuro-weave-e2e-logs/backend.pid"
          if [ ! -f "$pid_file" ]; then
            exit 0
          fi
          pid="$(cat "$pid_file")"
          if kill -0 "$pid" 2>/dev/null; then
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            for attempt in {1..10}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            pkill -KILL -P "$pid" 2>/dev/null || true
            kill -KILL "$pid" 2>/dev/null || true
          fi
      - name: Upload frontend diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: neuro-frontend-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            app/client/coverage/
            app/tests/cache/frontend-dist/
            app/tests/cache/eslint/
            .ci-logs/
            ${{ runner.temp }}/neuro-weave-e2e-logs/
