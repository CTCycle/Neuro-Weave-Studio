name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: app
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  npm_config_cache: ${{ github.workspace }}/runtimes/cache/npm
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python-bytecode
  PYTHON_EGG_CACHE: ${{ github.workspace }}/runtimes/cache/python-eggs
  RUFF_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/ruff
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright/browsers

jobs:
  backend:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install locked QA dependencies
        run: >-
          uv sync --locked --project app/server
          --extra test
          --extra torch-cpu
          --extra export
      - name: Compile backend
        run: uv run --project app/server python -m compileall app/server
      - name: Ruff
        working-directory: app/server
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          uv run ruff check . ../tests 2>&1 | tee ../../.ci-logs/ruff.log
      - name: Pyright
        working-directory: app/server
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          uv run pyright 2>&1 | tee ../../.ci-logs/pyright.log
      - name: Backend tests
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          uv run --project app/server python -m pytest app/tests -q 2>&1 | tee .ci-logs/pytest.log
      - name: Upload backend diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: neuro-backend-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            runtimes/cache/pytest/
            runtimes/cache/pytest-tmp/
            runtimes/cache/python-bytecode/
            runtimes/cache/ruff/
            .ci-logs/

  native-parity:
    name: Native parity (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: tensorflow
            extra: tensorflow
          - backend: pytorch
            extra: torch-cpu
          - backend: jax
            extra: jax
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install native parity dependencies
        run: >-
          uv sync --locked --project app/server
          --extra test
          --extra ${{ matrix.extra }}
      - name: Native parity subset
        env:
          NEURO_WEAVE_REQUIRED_NATIVE_BACKEND: ${{ matrix.backend }}
        run: >-
          uv run --project app/server python -m pytest
          app/tests/test_native_backend_parity.py -q
          -k "native_dense_values_are_deterministic_across_frameworks or native_representative_cases or native_multi_input_multi_output_signatures_match"

  frontend:
    name: Angular quality, tests, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Install locked dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: app/client
        run: npm run lint
      - name: Unit tests
        working-directory: app/client
        run: npm test
      - name: Production build
        working-directory: app/client
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          npm run build 2>&1 | tee ../../.ci-logs/frontend-build.log
      - name: Set up Python for browser tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up UV for browser tests
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install backend runtime for browser tests
        run: uv sync --locked --project app/server --extra torch-cpu
      - name: Start backend for browser tests
        env:
          NEURO_WEAVE_RESOURCES_DIR: ${{ runner.temp }}/neuro-weave-resources
        run: |
          mkdir -p "$NEURO_WEAVE_RESOURCES_DIR"
          cat > "$NEURO_WEAVE_RESOURCES_DIR/database-config.json" <<EOF
          {
            "schema_version": 1,
            "backend": "sqlite",
            "sqlite_path": "${{ runner.temp }}/neuro-weave-e2e.db",
            "connect_timeout_seconds": 30
          }
          EOF
          mkdir -p "${{ runner.temp }}/neuro-weave-e2e-logs"
          nohup uv run --project app/server uvicorn app:create_app --factory --host 127.0.0.1 --port 8000 > "${{ runner.temp }}/neuro-weave-e2e-logs/backend.log" 2>&1 &
          echo $! > "${{ runner.temp }}/neuro-weave-e2e-logs/backend.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${{ runner.temp }}/neuro-weave-e2e-logs/backend.log"
          exit 1
      - name: Prime runtime capability discovery
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/api/execution/discovery \
            -H 'content-type: application/json' \
            -d '{"backend":"pytorch","api":"keras"}'
          for attempt in {1..90}; do
            response="$(curl --fail --silent --show-error \
              'http://127.0.0.1:8000/api/execution/discovery?backend=pytorch&api=keras')"
            state="$(printf '%s' "$response" | jq -r '.state')"
            if [ "$state" = "verified" ]; then
              exit 0
            fi
            if [ "$state" = "unavailable" ] || [ "$state" = "failed" ]; then
              printf '%s\n' "$response"
              exit 1
            fi
            sleep 1
          done
          printf '%s\n' "$response"
          exit 1
      - name: Install Playwright browser
        working-directory: app/client
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: app/client
        env:
          FASTAPI_HOST: 127.0.0.1
          FASTAPI_PORT: 8000
        run: |
          mkdir -p ../../.ci-logs
          set -o pipefail
          npm run e2e -- node-functional-matrix.spec.ts 2>&1 | tee ../../.ci-logs/playwright.log
      - name: Stop backend for browser tests
        if: ${{ always() }}
        run: |
          pid_file="${{ runner.temp }}/neuro-weave-e2e-logs/backend.pid"
          if [ ! -f "$pid_file" ]; then
            exit 0
          fi
          pid="$(cat "$pid_file")"
          if kill -0 "$pid" 2>/dev/null; then
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            for attempt in {1..10}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            pkill -KILL -P "$pid" 2>/dev/null || true
            kill -KILL "$pid" 2>/dev/null || true
          fi
      - name: Upload frontend diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: neuro-frontend-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            runtimes/cache/angular/
            runtimes/cache/eslint/
            runtimes/cache/frontend-dist/
            assets/QA/playwright/test-results/
            runtimes/cache/typescript/
            runtimes/cache/vite/
            .ci-logs/
            ${{ runner.temp }}/neuro-weave-e2e-logs/
